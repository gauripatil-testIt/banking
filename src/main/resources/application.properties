spring.datasource.url=jdbc:h2:mem:bankingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Documents go to this machine's disk in local development; a deployment sets
# BANKING_DOCUMENTS_STORAGE=s3 together with its bucket and region (BANK-5 guide, section 3).
banking.documents.storage=local
banking.documents.storage-dir=./uploads/documents
banking.documents.allowed-extensions=pdf,jpg,png
banking.documents.max-file-size=10MB

# Local development only: announce business events in memory, with no broker installed.
# A deployment overrides this with banking.events.bus=kafka (the default when unset).
banking.events.bus=in-memory
banking.events.topic=banking.events

# Background task queues. The exchange name and the per-task queue names are defaults in
# TaskQueueProperties; no broker host, credential or other connection setting is set here,
# so those come from the environment (spring.rabbitmq.* / SPRING_RABBITMQ_*).
banking.tasks.exchange=banking.tasks

# The relay that publishes the outbox rows to RabbitMQ: how often it looks for pending work,
# and whether it runs at all. A test that drives the relay itself switches it off.
banking.tasks.relay-enabled=true
banking.tasks.relay-interval=2s

# A task counts as submitted only when the broker confirms it, and an unroutable message
# must come back to the publisher instead of being silently dropped.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

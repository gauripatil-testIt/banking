spring.datasource.url=jdbc:h2:mem:bankingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

banking.documents.storage-dir=./uploads/documents
banking.documents.allowed-extensions=pdf,jpg,png
banking.documents.max-file-size=10MB

# Local development only: announce business events in memory, with no broker installed.
# A deployment overrides this with banking.events.bus=kafka (the default when unset).
banking.events.bus=in-memory
banking.events.topic=banking.events

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.datasource.url=jdbc:h2:mem:bankingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Local development only, like the in-memory event bus below: the packaged default resolves to the
# local backend, so a plain workstation run needs no bucket and no AWS credentials. A deployment
# sets banking.documents.storage=s3 with its bucket and region in the environment; when it does, a
# missing bucket or region still fails startup with BANK-5's readable message.
banking.documents.storage=local
banking.documents.storage-dir=./uploads/documents
banking.documents.allowed-extensions=pdf,jpg,png
banking.documents.max-file-size=10MB

# Local development only: announce business events in memory, with no broker installed.
# A deployment overrides this with banking.events.bus=kafka (the default when unset).
banking.events.bus=in-memory
banking.events.topic=banking.events

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

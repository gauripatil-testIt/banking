spring.datasource.url=jdbc:h2:mem:bankingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# The document backend this configuration runs against: the file next to it is a
# development configuration (in-memory H2, local upload directory), so it selects the
# local disk backend. A deployment sets BANKING_DOCUMENTS_STORAGE=s3 together with its
# bucket and region, which overrides this value; selecting s3 without those settings
# still fails startup with the readable message instead of guessing.
banking.documents.storage=local
banking.documents.storage-dir=./uploads/documents
banking.documents.allowed-extensions=pdf,jpg,png
banking.documents.max-file-size=10MB

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# The business events of every change are written to the outbox in the same
# transaction as the change, and a scheduled drain publishes them from there. These
# are the drain's own settings: how many attempts an event gets before it is given up
# on, how long to wait between two attempts, how many rows one drain takes, and how
# often the drain runs.
banking.events.outbox.max-attempts=5
banking.events.outbox.retry-delay=PT30S
banking.events.outbox.batch-size=200
banking.events.outbox.drain-interval=PT1S

# BANK-7: the local profile points the publisher at the Kafka started by docker-compose.yml
# (`docker compose up -d`), so a reviewer sees real events in the real topic banking.events.
# The default profile keeps the in-memory bus documented in docs/BANK-6-business-event-format.md;
# this file overrides it for local runs only.
banking.events.bus=kafka
banking.events.kafka.bootstrap-servers=localhost:9092

# The local profile keeps documents on the application server's disk (BANK-5 section 5.1).
# BANK-5's default backend is S3 and refuses to start without a bucket and region from the
# environment, so a workstation run of this profile must select the local backend here.
banking.documents.storage=local
banking.documents.storage-dir=./uploads/documents
